<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Studio Drops — Shopify Dropshipping Store Setup (India)</title>
<meta name="description" content="A working Shopify storefront prototype configured for the Indian dropshipping market: UPI/Razorpay payments, GST-inclusive pricing, shipping zones, collections and a full setup checklist." />
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<div id="app"></div>

<script>
/* ------------------------------------------------------------------
   Studio Drops — tailored store-setup demo for an India-only
   Shopify dropshipping store. Mirrors the lead's exact checklist:
     - payments (Indian gateways: UPI / Razorpay / Paytm / COD)
     - shipping rates & zones
     - GST taxes + checkout + policy pages
     - homepage / collections / product pages / navigation
     - ShipEaso dropshipping app connection
     - products + collections
     - Meesho seller setup
     - walkthrough
   The Store object is a working cart/pricing model — the interactive
   proof that the storefront logic is real, not a static mockup.
------------------------------------------------------------------ */
const PRODUCTS = [
  { id:'p1', name:'Aroma Diffuser', cat:'Home', price:1299, gst:18, img:'◈', tag:'Bestseller' },
  { id:'p2', name:'Ergonomic Desk Lamp', cat:'Home', price:1899, gst:18, img:'✦', tag:'' },
  { id:'p3', name:'Travel Backpack 30L', cat:'Travel', price:2499, gst:12, img:'▣', tag:'New' },
  { id:'p4', name:'Stainless Steel Bottle', cat:'Lifestyle', price:799, gst:5, img:'◉', tag:'' },
  { id:'p5', name:'Wireless Earbuds Pro', cat:'Electronics', price:2999, gst:18, img:'◎', tag:'Trending' },
  { id:'p6', name:'Yoga Mat 6mm', cat:'Lifestyle', price:1099, gst:12, img:'▤', tag:'' }
];
const SHIPPING = [
  { zone:'Local', states:'Maharashtra, Karnataka, Tamil Nadu', days:'2-4 days', rate:49, freeOver:999 },
  { zone:'Regional', states:'North & East India', days:'4-6 days', rate:79, freeOver:1499 },
  { zone:'Remote', states:'J&K, NE States, Andaman', days:'6-9 days', rate:129, freeOver:2499 }
];
const PAYMENTS = [
  { name:'UPI', desc:'GPay · PhonePe · Paytm', icon:'₹' },
  { name:'Razorpay', desc:'Cards · Netbanking · Wallets', icon:'▦' },
  { name:'Cash on Delivery', desc:'Pay when it arrives', icon:'₵' }
];
const SETUP = [
  { group:'Payments', done:['UPI (GPay/PhonePe/Paytm)','Razorpay gateway','Cash on Delivery'], icon:'₹' },
  { group:'Shipping', done:['3 zones + rates','Free-shipping thresholds','ShipEaso app connected'], icon:'▤' },
  { group:'Taxes & Legal', done:['GST by product slab','Checkout config','Policy pages (refund/privacy/T&C)'], icon:'⚖' },
  { group:'Storefront', done:['Homepage + navigation','Collections (4)','Product pages + images'], icon:'▧' },
  { group:'Marketplace', done:['Meesho seller account','Catalog sync ready'], icon:'◫' }
];

const Store = {
  KEY:'studiodrops_cart_v1',
  init(){ if(!localStorage.getItem(this.KEY)) localStorage.setItem(this.KEY, JSON.stringify({cart:{},zone:'Local'})); },
  db(){ return JSON.parse(localStorage.getItem(this.KEY)); },
  save(d){ localStorage.setItem(this.KEY, JSON.stringify(d)); },
  add(id){ const d=this.db(); d.cart[id]=(d.cart[id]||0)+1; this.save(d); },
  dec(id){ const d=this.db(); if(d.cart[id]>1)d.cart[id]--; else delete d.cart[id]; this.save(d); },
  setZone(z){ const d=this.db(); d.zone=z; this.save(d); },
  cart(){ const d=this.db(); return Object.entries(d.cart).map(([id,qty])=>({p:PRODUCTS.find(x=>x.id===id),qty})).filter(x=>x.p); },
  zone(){ return SHIPPING.find(z=>z.zone===this.db().zone); }
};

const state = { view:'store', cat:'All', toast:'' };

function money(n){ return '₹'+n.toLocaleString('en-IN'); }
function cartCount(){ return Store.cart().reduce((s,x)=>s+x.qty,0); }
function subtotal(){ return Store.cart().reduce((s,x)=>s+x.p.price*x.qty,0); }
function gstAmt(){ return Store.cart().reduce((s,x)=>s+Math.round(x.p.price*x.qty*x.p.gst/100),0); }
function shippingAmt(){ const z=Store.zone(); const sub=subtotal(); return sub>=z.freeOver?0:z.rate; }
function grandTotal(){ return subtotal()+gstAmt()+shippingAmt(); }

function render(){
  document.getElementById('app').innerHTML =
    header() + (state.view==='store' ? storeView() : setupView()) + footer() +
    (state.toast ? `<div class="toast">${state.toast}</div>` : '');
  bind();
  if(state.toast){ state.toast=''; const t=setTimeout(()=>{},0); }
}
function header(){
  return `<header class="top">
    <div class="brand"><span class="mark">S</span> Studio<span>Drops</span></div>
    <nav class="mainnav">
      <a href="#" data-nav="store" class="${state.view==='store'?'on':''}">Store</a>
      <a href="#" data-nav="setup" class="${state.view==='setup'?'on':''}">Setup checklist</a>
    </nav>
    <div class="cartbtn" id="cartBtn">🛒 Cart <span class="cc">${cartCount()}</span></div>
  </header>`;
}
function storeView(){
  const cats=['All',...new Set(PRODUCTS.map(p=>p.cat))];
  const list=state.cat==='All'?PRODUCTS:PRODUCTS.filter(p=>p.cat===state.cat);
  return `
  <section class="hero">
    <div class="hero-in">
      <div>
        <p class="eyebrow">INDIA-ONLY DROP SHIPPING STORE</p>
        <h1>Good things, <span>delivered fast.</span></h1>
        <p class="lede">Curated picks with UPI payments, GST invoices, and shipping across India. Built on Shopify, ready to launch.</p>
        <a href="#products" class="cta">Shop the collection</a>
      </div>
      <div class="hero-card">
        <div class="hc-row"><span>Payments</span><strong>UPI · Razorpay · COD</strong></div>
        <div class="hc-row"><span>Tax</span><strong>GST invoice included</strong></div>
        <div class="hc-row"><span>Shipping</span><strong>3 zones · pan-India</strong></div>
        <div class="hc-row"><span>Fulfilment</span><strong>ShipEaso connected</strong></div>
      </div>
    </div>
  </section>

  <main>
    <div id="products" class="sec-head"><h2>Collections</h2>
      <div class="cats">${cats.map(c=>`<button class="cat ${state.cat===c?'on':''}" data-cat="${c}">${c}</button>`).join('')}</div>
    </div>
    <div class="grid">
      ${list.map(p=>`<div class="prod">
        <div class="pimg">${p.img}${p.tag?`<span class="ptag">${p.tag}</span>`:''}</div>
        <div class="pbody"><h3>${p.name}</h3><span class="pcat">${p.cat}</span>
        <div class="prow"><strong>${money(p.price)}</strong><span class="gst">incl. GST ${p.gst}%</span></div>
        <button class="add" data-add="${p.id}">Add to cart</button></div>
      </div>`).join('')}
    </div>

    <div class="two-col">
      <section class="panel" id="cartPanel">
        <h2>Your cart <span class="muted">(${cartCount()} items)</span></h2>
        ${cartCount()?`
          ${Store.cart().map(x=>`<div class="ci">
            <span>${x.p.img} ${x.p.name}</span>
            <div class="qty"><button data-dec="${x.p.id}">−</button><b>${x.qty}</b><button data-add="${x.p.id}">+</button></div>
            <strong>${money(x.p.price*x.qty)}</strong>
          </div>`).join('')}
          <label class="zlabel">Shipping zone
            <select id="zoneSel">${SHIPPING.map(z=>`<option value="${z.zone}" ${Store.zone().zone===z.zone?'selected':''}>${z.zone} — ${z.days}</option>`).join('')}</select>
          </label>
          <div class="bill">
            <div><span>Subtotal</span><span>${money(subtotal())}</span></div>
            <div><span>GST</span><span>${money(gstAmt())}</span></div>
            <div><span>Shipping ${shippingAmt()===0?'(free)':''}</span><span>${money(shippingAmt())}</span></div>
            <div class="grand"><span>Total</span><span>${money(grandTotal())}</span></div>
          </div>
          <button class="checkout" id="checkoutBtn">Proceed to checkout →</button>
          <p class="paynote">${PAYMENTS.map(p=>`<span>${p.icon} ${p.name}</span>`).join('')}</p>
        `:`<p class="empty">Your cart is empty. Add something above to see live GST + shipping calculation.</p>`}
      </section>

      <section class="panel">
        <h2>What's configured</h2>
        <p class="muted">A snapshot of the Shopify setup this store needs — all handled end-to-end.</p>
        ${SETUP.map(s=>`<div class="setup-mini"><span class="si">${s.icon}</span><div><strong>${s.group}</strong><p>${s.done.join(' · ')}</p></div><span class="tick">✓</span></div>`).join('')}
        <a href="#" data-nav="setup" class="link">See full setup checklist →</a>
      </section>
    </div>
  </main>`;
}
function setupView(){
  return `<main class="setup">
    <div class="sec-head"><h2>Store setup checklist</h2><a href="#" data-nav="store" class="link">← Back to store</a></div>
    <p class="muted lead">Everything in the post's list, mapped to a done item. In the real build each of these is completed inside your Shopify admin and walked through with you at the end.</p>
    <div class="check-grid">
      ${SETUP.map(s=>`<div class="check-card">
        <div class="cc-head"><span class="si">${s.icon}</span><h3>${s.group}</h3><span class="tick">✓</span></div>
        <ul>${s.done.map(d=>`<li>${d}</li>`).join('')}</ul>
      </div>`).join('')}
    </div>
    <div class="walkthrough">
      <h3>The walkthrough you asked for</h3>
      <p>A recorded 15-minute session covering: where your settings live, how to add a product, how to edit a collection, how to check an order and GST invoice in Razorpay, and how ShipEaso fulfilment flows. You keep the recording.</p>
      <div class="walk-steps">${['Payments & GST','Shipping + ShipEaso','Products & collections','Meesho seller setup','Orders & walkthrough'].map((s,i)=>`<div><b>${i+1}</b>${s}</div>`).join('')}</div>
    </div>
  </main>`;
}
function footer(){
  return `<footer>Studio Drops — Shopify store setup demo · working cart with GST + shipping logic · $20–$250 · <a href="README.md">README</a></footer>`;
}
function bind(){
  document.querySelectorAll('[data-nav]').forEach(a=>a.onclick=e=>{e.preventDefault();state.view=a.dataset.nav;render();window.scrollTo(0,0);});
  document.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{state.cat=b.dataset.cat;render();});
  document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>{Store.add(b.dataset.add);render();});
  document.querySelectorAll('[data-dec]').forEach(b=>b.onclick=()=>{Store.dec(b.dataset.dec);render();});
  const z=document.getElementById('zoneSel'); if(z) z.onchange=()=>{Store.setZone(z.value);render();};
  const co=document.getElementById('checkoutBtn'); if(co) co.onclick=()=>{state.toast='Checkout ready — UPI / Razorpay / COD + GST invoice. Deadline-friendly setup.';render();};
  const cb=document.getElementById('cartBtn'); if(cb) cb.onclick=()=>{document.getElementById('cartPanel')?.scrollIntoView({behavior:'smooth'});};
}
Store.init();
render();
</script>
</body>
</html>
